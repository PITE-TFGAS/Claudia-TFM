<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h3>Asistente Navegación Web</h3>

  <div class="control-group">
    <label class="switch-label" for="toggle-enable">Activar Asistente</label>
    <label class="switch">
      <input type="checkbox" id="toggle-enable">
      <span class="slider"></span>
    </label>
  </div>
  <p id="status" class="status-text"></p>

  <hr>

  <div class="control-group">
    <label class="switch-label" for="toggle-design">Diseño minimalista</label>
    <label class="switch">
      <input type="checkbox" id="toggle-design">
      <span class="slider"></span>
    </label>
  </div>
  <p class="small-hint">Desactiva la accesibilidad del diseño</p>

  <hr>

  <details class="advanced-settings" id="details-add-expert">
    <summary>⚙️ Configurar IA Experta (Avanzado)</summary>
    <div class="expert-form">
      <label for="expert-domain">Sitio Web</label>
      <input type="text" id="expert-domain" placeholder="www.iberia.com">
      
      <label for="expert-endpoint">Endpoint (URL de tu IA)</label>
      <input type="url" id="expert-endpoint" placeholder="https://tu-api.com/ruta">
      
      <label for="expert-apikey">API Key (Opcional)</label>
      <input type="password" id="expert-apikey" placeholder="sk-...">
      
      <button id="btn-save-expert">Guardar Experto</button>
      <p id="expert-status" class="expert-status"></p>
    </div>
  </details>

  <details class="advanced-settings" id="details-manage-experts">
    <summary>📂 Gestionar IAs Guardadas</summary>
    <div id="saved-experts-list" class="expert-list">
      </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
